# "Monitoring" and "Technologies" lanes in the diagram:
# scans every repo, writes CSV reports (CMDB + technology usage), commits them to reports/.
name: Portfolio audit

on:
  schedule:
    - cron: "17 11 * * 1"      # Mondays 11:17 UTC
  workflow_dispatch:
    inputs:
      tech:
        description: "Technology audit only (e.g. jquery). Leave blank for a full audit."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: Run audit
        env:
          # GITHUB_TOKEN sees public repos. For private repos add a fine-grained PAT
          # (Contents: read on all repos) as the AUDIT_TOKEN secret.
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN || github.token }}
        run: |
          if [ -n "${{ inputs.tech }}" ]; then
            python tools/audit.py --owner ${{ github.repository_owner }} --tech "${{ inputs.tech }}" > summary.md
          else
            python tools/audit.py --owner ${{ github.repository_owner }} > summary.md
          fi
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit reports
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Audit: update compliance reports"
          git push
